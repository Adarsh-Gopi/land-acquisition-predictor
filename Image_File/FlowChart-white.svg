<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc">
  <title id="title">Land acquisition delay prediction system flowchart</title>
  <desc id="desc">A flowchart showing data entry, application processing, model availability, risk analysis, storage availability, and the monitoring views.</desc>
  <rect width="1600" height="1100" fill="#ffffff"/>
  <style>
    .box { fill:#ffffff; stroke:#174a7e; stroke-width:3; rx:14; }
    .decision { fill:#eef6ff; stroke:#174a7e; stroke-width:3; }
    .endbox { fill:#eaf7ef; stroke:#257447; stroke-width:3; rx:14; }
    .arrow { fill:none; stroke:#40566d; stroke-width:3; marker-end:url(#arrow); }
    .label { font-family:Arial, sans-serif; font-size:28px; font-weight:700; fill:#123452; text-anchor:middle; }
    .small { font-family:Arial, sans-serif; font-size:22px; fill:#2d4f6c; text-anchor:middle; }
    .branch { font-family:Arial, sans-serif; font-size:21px; font-weight:700; fill:#40566d; text-anchor:middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#40566d"/></marker>
  </defs>

  <text x="800" y="55" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#123452" text-anchor="middle">Land Acquisition Delay Prediction System</text>

  <rect class="box" x="545" y="95" width="510" height="92"/>
  <text class="label" x="800" y="136">User enters land acquisition case</text>
  <text class="small" x="800" y="168">project, legal, funding and progress details</text>
  <path class="arrow" d="M800 187 V240"/>

  <rect class="box" x="545" y="245" width="510" height="92"/>
  <text class="label" x="800" y="285">Web Application</text>
  <text class="small" x="800" y="317">Express + EJS processes the request</text>
  <path class="arrow" d="M800 337 V390"/>

  <rect class="decision" x="545" y="410" width="510" height="90" rx="14"/>
  <text class="label" x="800" y="449">ML service available?</text>
  <path class="arrow" d="M545 455 H355 V570"/>
  <text class="branch" x="450" y="442">Yes</text>
  <path class="arrow" d="M1055 455 H1245 V570"/>
  <text class="branch" x="1150" y="442">No</text>

  <rect class="box" x="120" y="575" width="470" height="100"/>
  <text class="label" x="355" y="618">FastAPI + XGBoost Model</text>
  <text class="small" x="355" y="650">ML prediction and explanation</text>
  <rect class="box" x="1010" y="575" width="470" height="100"/>
  <text class="label" x="1245" y="618">Rule-based Backup</text>
  <text class="small" x="1245" y="650">offline prediction</text>
  <path class="arrow" d="M355 675 V730 H800"/>
  <path class="arrow" d="M1245 675 V730 H800"/>

  <rect class="box" x="545" y="735" width="510" height="92"/>
  <text class="label" x="800" y="776">Risk Analysis Result</text>
  <text class="small" x="800" y="808">probability, tier, risk factors and actions</text>
  <path class="arrow" d="M800 827 V880"/>

  <rect class="box" x="545" y="885" width="510" height="78"/>
  <text class="label" x="800" y="934">Save Assessment</text>
  <path class="arrow" d="M800 963 V1005"/>

  <rect class="decision" x="545" y="1025" width="510" height="90" rx="14"/>
  <text class="label" x="800" y="1065">MongoDB available?</text>
  <path class="arrow" d="M545 1070 H355 V1185"/>
  <text class="branch" x="450" y="1057">Yes</text>
  <path class="arrow" d="M1055 1070 H1245 V1185"/>
  <text class="branch" x="1150" y="1057">No</text>

  <rect class="endbox" x="120" y="1190" width="470" height="92"/>
  <text class="label" x="355" y="1232">MongoDB</text>
  <text class="small" x="355" y="1264">persistent assessment history</text>
  <rect class="endbox" x="1010" y="1190" width="470" height="92"/>
  <text class="label" x="1245" y="1232">Temporary Memory</text>
  <text class="small" x="1245" y="1264">when database is offline</text>
  <path class="arrow" d="M355 1282 V1335 H800"/>
  <path class="arrow" d="M1245 1282 V1335 H800"/>

  <rect class="endbox" x="445" y="1340" width="710" height="82"/>
  <text class="label" x="800" y="1375">Dashboard, Alerts, History and GIS Map</text>
  <text class="small" x="800" y="1405">monitoring and decision support</text>
</svg>
